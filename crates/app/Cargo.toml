[package]
name = "steward-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
global-hotkey.workspace = true
anyhow.workspace = true
raw-window-handle = "0.6"
dirs.workspace = true
crossbeam-channel.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
unic-langid.workspace = true
steward-core-engine = { path = "../core-engine" }
steward-storage = { path = "../storage" }
steward-ui-components = { path = "../ui-components" }
steward-plugin-registry = { path = "../plugin-registry" }
steward-plugin-host = { path = "../plugin-host" }
steward-ipc-protocol = { path = "../ipc-protocol" }
serde_json.workspace = true
arboard.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Input_Ime",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3"

[package.metadata.bundle]
name = "Steward"
identifier = "com.hiaspirin.steward"
icon = ["../../assets/icon.ico"]
