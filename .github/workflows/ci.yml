name: CI

on:
  # Master is developed by pushing to it directly, so those commits have to be
  # verified here too: a pull-request-only trigger would leave every direct
  # push unchecked.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer run on the same ref makes an in-flight one pointless; cancelling it
# keeps a burst of pushes from queueing behind itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (Windows)
    # Steward ships on Windows only, so CI validates that one platform. The
    # crates keep their non-Windows `cfg` branches compiling, but nothing
    # exercises them any more.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: validate production trust roots
        shell: pwsh
        run: ./scripts/verify-trust-roots.ps1
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  typescript:
    name: TypeScript
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pdx1-plugin-cli
      - name: Install pinned NSH CLI
        run: cargo install --locked nsh-cli --version 0.6.1
      - name: install
        run: pnpm install --frozen-lockfile
      - name: plugin contract
        run: pnpm contract:check
      - name: build contract harness SDK
        run: pnpm --filter @steward/extension-api build
      - name: plugin contract fixtures
        run: pnpm test:contract
      - name: plugin API v1 hardening
        run: pnpm test:pdx3
      - name: SDK distribution and external plugin lifecycle
        run: pnpm test:pdx1
      - name: developer mode and static reload lifecycle
        run: pnpm test:pdx2
      - name: ecosystem operations and quarantine lifecycle
        run: pnpm test:pdx4
      - name: lint
        run: pnpm lint
      - name: format
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: plugin tests
        run: pnpm test:plugins
