[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core-engine",
    "crates/plugin-host",
    "crates/plugin-registry",
    "crates/storage",
    "crates/ui-components",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Steward contributors"]
license = "MIT"

[workspace.dependencies]
# NSH migration stack. Keep these exact until the migration evidence in
# docs/nsh-migration.md is updated. GPUI Fast and NSH are compiled together and
# must be upgraded as one reviewed change.
gpui = { package = "gpui-fast", version = "=0.1.9", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.9", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui-kit = { version = "=0.7.3", features = ["gpui-fast"] }
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "5359c07ff7b5728e67957c24322373309c90666b" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "5359c07ff7b5728e67957c24322373309c90666b", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "5359c07ff7b5728e67957c24322373309c90666b" }
nsh-package = { git = "https://github.com/longbridge/nsh", rev = "5359c07ff7b5728e67957c24322373309c90666b" }
nsh-platform-gpui = { git = "https://github.com/longbridge/nsh", rev = "5359c07ff7b5728e67957c24322373309c90666b", default-features = false, features = ["js"] }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "5359c07ff7b5728e67957c24322373309c90666b", default-features = false }
thiserror = "2"
global-hotkey = "0.8"
tray-icon = "0.24"
nucleo = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tracing = "0.1"
anyhow = "1"
dirs = "6"
crossbeam-channel = "0.5"
tyme4rs = "1.5"
ureq = "2.9"
url = "2"

# i18n (Fluent — Zed's localization stack)
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
unic-langid = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
