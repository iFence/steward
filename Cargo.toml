[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core-engine",
    "crates/plugin-host",
    "crates/plugin-registry",
    "crates/storage",
    "crates/ui-components",
    "crates/ipc-protocol",
    "plugin-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Steward contributors"]
license = "MIT"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
global-hotkey = "0.8"
tray-icon = "0.24"
nucleo = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
rquickjs = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tracing = "0.1"
anyhow = "1"
dirs = "6"
crossbeam-channel = "0.5"

# i18n (Fluent — Zed's localization stack)
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
unic-langid = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
